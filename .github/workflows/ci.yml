name: CI

on:
  push:
  pull_request:

jobs:
  # The Linux build needs GTK 4 and Wayland, which the flake provides; its
  # checks build vestal, run the tests and smoke-test the CLI.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix flake check -L

  # Swift 5.10 itself, the toolchain the Nix build uses, is covered by the
  # Linux job above (nixpkgs' pinned 5.10). This job checks that the sources
  # also build with a current Apple toolchain: Xcode 16.4 has the Swift 6.1
  # compiler, and tools-version 5.9 keeps it in Swift 5 language mode.
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # Set via DEVELOPER_DIR so a missing Xcode fails loudly instead of
      # silently building with another compiler.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: swift --version | tee /dev/stderr | grep -q 'Swift version 6\.1'
      - run: swift build -c release
      - if: hashFiles('Tests/**/*.swift') != ''
        run: swift test
